name: Apply direct Buffer uploads to R2

on:
  push:
    branches: [improve/r2-media-streaming]

permissions:
  contents: write

jobs:
  patch-buffer-uploads:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch media upload paths
        run: |
          echo '' | base64 -d > /tmp/patch_r2.py
          python3 /tmp/patch_r2.py
      - name: Verify and test
        run: |
          npm ci
          npm test
      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+hoenotfound@users.noreply.github.com"
          git rm .github/workflows/patch-r2-buffer-uploads.yml
          git add src/db/messagesRepo.js src/utils/conversationStore.js src/server.js src/routes/conversations.js test/messagesRepo.test.js
          git commit -m "Pass media Buffers directly to R2 uploads"
          git push
