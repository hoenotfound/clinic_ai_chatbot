name: Neutro migration access check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neutro-production-migration
  cancel-in-progress: false
jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: neutro-migration-recovery
    steps:
      - name: Fetch reviewed migration helpers
        uses: actions/checkout@v7
        with:
          ref: 2e5cd8812d11483725f1dcb50135e7041cc1a1ec
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify guards without production credentials
        run: node --test test/neutroMigrationCopy.test.js test/neutroMigrationRecovery.test.js test/neutroMigrationRehearsal.test.js
      - name: Check Render access without changing production
        env:
          RENDER_API_KEY: ${{ secrets.NEUTRO_RECOVERY_RENDER_API_KEY }}
        run: node scripts/neutroMigrationRecovery.cjs --check
