name: PR116 Hardening

on:
  push:
    branches:
      - feature/unified-go-live-gate
    paths:
      - .github/workflows/pr116-hardening.yml

permissions:
  contents: write

jobs:
  harden-and-validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: chatbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chatbot_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/unified-go-live-gate
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply hardening patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/pr116Hardening.py")
          text = path.read_text()
          old = '''test("readiness preserves structured Setup Status reason codes", () => {
            const overview = fullyReadyOverview();
            overview.checks = overview.checks.map((item) =>
              item.key === "whatsapp_webhook"
                ? { ...item, status: "warning", configured: true, reason: "live_evidence_pending" }
                : item
            );
            const report = evaluateReadiness(overview, {
              expectedIndustry: "aesthetic_clinic",
              requiredChannels: ["whatsapp"],
            });'''
          new = '''test("readiness preserves structured Setup Status reason codes", () => {
            const data = overview();
            data.checks = data.checks.map((item) =>
              item.key === "whatsapp_webhook"
                ? { ...item, status: "warning", configured: true, reason: "live_evidence_pending" }
                : item
            );
            const report = evaluateReadiness(data, {
              expectedIndustry: "home_renovation",
              requiredChannels: ["whatsapp"],
            });'''
          if old not in text:
              raise SystemExit("structured reason-code test template was not found exactly once")
          if text.count(old) != 1:
              raise SystemExit(f"structured reason-code test template matched {text.count(old)} times")
          path.write_text(text.replace(old, new, 1))
          PY
          python3 scripts/pr116Hardening.py
      - name: Backend install
        run: npm ci
      - name: Backend tests
        run: npm test
      - name: Portal install
        working-directory: portal-frontend
        run: npm ci
      - name: Portal lint
        working-directory: portal-frontend
        run: npm run lint
      - name: Portal build
        working-directory: portal-frontend
        run: npm run build
      - name: Commit verified hardening and remove temporary files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/pr116Hardening.py .github/workflows/pr116-hardening.yml
          git add -A
          git diff --cached --check
          git commit -m "Harden unified go-live gate"
          git push origin HEAD:feature/unified-go-live-gate
