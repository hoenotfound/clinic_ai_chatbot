name: Finalize attribution UI

on:
  push:
    branches: [feature/lead-source-attribution]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lead-source-attribution
          fetch-depth: 0
      - name: Apply final UI refinements
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('portal-frontend/src/pages/Pipeline.jsx')
          text = path.read_text()
          old = '  const metricLeads = hasAnalyticsDrilldown ? drilldownLeads : leads;'
          new = '  const metricLeads = hasAnalyticsDrilldown || sourceFilter !== "all" ? drilldownLeads : leads;'
          if old not in text:
              raise SystemExit('Pipeline metric target not found')
          path.write_text(text.replace(old, new, 1))

          drawer = Path('portal-frontend/src/components/pipeline/LeadDrawer.jsx')
          text = drawer.read_text()
          text = text.replace('<Field label="Lead source">', '<Field label="Lead source (manual override)">', 1)
          text = text.replace('<Field label="Campaign">', '<Field label="Campaign (manual override)">', 1)
          drawer.write_text(text)
          PY
          git rm .github/workflows/finalize-attribution-ui.yml
      - name: Commit refinements and remove this one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portal-frontend/src/pages/Pipeline.jsx portal-frontend/src/components/pipeline/LeadDrawer.jsx .github/workflows/finalize-attribution-ui.yml
          git commit -m "Finalize lead attribution Pipeline UI"
          git push origin HEAD:feature/lead-source-attribution
