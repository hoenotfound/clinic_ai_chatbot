name: PR395 pinned localhost HTTPS receiver acceptance (no deploy)

# PR-only isolated TLS test; no provider traffic, Render API or Neon connection.
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/pr395-https-receiver-isolation-check.yml"
      - "scripts/qa/pr395HttpsRelayRehearsal.cjs"

permissions:
  contents: read

concurrency:
  group: pr395-https-receiver-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  signed-localhost-https:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PR395_APPROVED_SHA: 662af9d16e911dd30825f861987e0dbcb1888340
    steps:
      - name: Checkout only synthetic test harness (no credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Check exact currently reviewed PR395 source
        shell: bash
        run: |
          set -euo pipefail
          git -c credential.helper= fetch --no-tags --depth=1 \
            https://github.com/hoenotfound/clinic_ai_chatbot.git refs/pull/395/head
          ACTUAL="$(git rev-parse FETCH_HEAD)"
          if [[ "$ACTUAL" != "$PR395_APPROVED_SHA" ]]; then
            echo "::error::PR395 changed; stop and re-review exact source."
            exit 1
          fi
          git show "$ACTUAL:src/services/whatsappAppDefaultRelay.js" > "$RUNNER_TEMP/pr395-relay-https-source.js"
          node --check "$RUNNER_TEMP/pr395-relay-https-source.js"
          node --check scripts/qa/pr395HttpsRelayRehearsal.cjs
          echo "Checked reviewed source SHA $ACTUAL; nothing deployed."

      - name: Create temporary localhost-only TLS key and certificate
        shell: bash
        run: |
          set -euo pipefail
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$RUNNER_TEMP/pr395-localhost.key" \
            -out "$RUNNER_TEMP/pr395-localhost.crt" \
            -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          chmod 600 "$RUNNER_TEMP/pr395-localhost.key"
          openssl x509 -in "$RUNNER_TEMP/pr395-localhost.crt" -noout -subject -ext subjectAltName

      - name: Test real TLS transport to isolated loopback receivers
        shell: bash
        env:
          PR395_RELAY_SOURCE: ${{ runner.temp }}/pr395-relay-https-source.js
          PR395_TLS_KEY: ${{ runner.temp }}/pr395-localhost.key
          PR395_TLS_CERT: ${{ runner.temp }}/pr395-localhost.crt
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/pr395-localhost.crt
        run: |
          set -euo pipefail
          test "$(printenv NODE_TLS_REJECT_UNAUTHORIZED || echo 1)" != "0"
          node --test scripts/qa/pr395HttpsRelayRehearsal.cjs

      - name: Scope statement
        if: always()
        run: |
          echo "All synthetic receiver URLs are .invalid and remapped to 127.0.0.1 HTTPS."
          echo "Never contacted Meta, Render, Neon, production callbacks or a real customer."
