name: Build Neutro Pulse Wave Safe Poster

on:
  push:
    branches:
      - fix/neutro-pulse-benefits-safe-promo-20261123
    paths:
      - scripts/buildNeutroPulsePromoPoster.py
      - .github/workflows/generate-neutro-pulse-poster.yml

permissions:
  contents: write

jobs:
  build-reviewed-poster:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install CJK font and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --quiet pillow==11.3.0
      - name: Build JPEG poster with approved copy
        run: python scripts/buildNeutroPulsePromoPoster.py
      - name: Commit safe poster to source branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portal-frontend/public/neutro-pulse-safe-20261123.jpg
          if ! git diff --cached --quiet; then
            git commit -m "assets: add reviewed Neutro Pulse Wave poster [skip ci]"
            git push origin HEAD:fix/neutro-pulse-benefits-safe-promo-20261123
          fi
