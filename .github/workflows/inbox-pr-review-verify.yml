name: Inbox PR Review Verify

on:
  push:
    branches: [feat/inbox-reply-forward-paste]

jobs:
  inbox-review:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm install --no-save @playwright/test@1.55.0
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify mobile Inbox actions
        run: npx playwright test e2e/critical-flows.spec.js --project=iphone-portrait --grep "Inbox message actions|mobile swipe right"
      - name: Verify image paste and preparation on Chromium
        run: npx playwright test e2e/realtime-media-flows.spec.js --project=desktop-chromium --grep "pasted WebP|progressive JPEG|staff can preview an image"
      - name: Verify WebP paste on iPhone WebKit
        run: npx playwright test e2e/realtime-media-flows.spec.js --project=iphone-portrait --grep "pasted WebP"
