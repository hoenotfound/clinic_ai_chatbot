name: Portal Feature Verify

on:
  push:
    branches: [feat/inbox-reply-forward-paste]

jobs:
  portal-feature-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
