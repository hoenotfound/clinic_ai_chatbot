name: Mobile Inbox Verify

on:
  push:
    branches: [feat/inbox-reply-forward-paste]

jobs:
  mobile-inbox-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm install --no-save @playwright/test@1.55.0
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test e2e/critical-flows.spec.js --project=iphone-portrait
