name: Apply lead attribution patch

on:
  push:
    branches: [feature/lead-source-attribution]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[attribution-patch-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lead-source-attribution
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/applyLeadAttributionPatch.js
      - name: Commit generated patch
        run: |
          if git diff --quiet; then
            echo "No patch changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/whatsappService.js src/services/metaMessagingService.js portal-frontend/src/pages/Pipeline.jsx portal-frontend/src/components/pipeline/LeadDrawer.jsx
          git commit -m "Apply lead attribution integration [attribution-patch-applied]"
          git push origin HEAD:feature/lead-source-attribution
