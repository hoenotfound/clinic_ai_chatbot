name: Apply attribution labels to Analytics

on:
  push:
    branches:
      - feature/lead-source-attribution

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lead-source-attribution
          fetch-depth: 0

      - name: Format attribution source labels in Analytics
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('portal-frontend/src/pages/Analytics.jsx')
          text = path.read_text()

          anchor = '''const PERFORMANCE_TABS = [
            ["source", "Source"],
            ["campaign", "Campaign"],
            ["treatment", "Treatment"],
            ["branch", "Branch"],
            ["channel", "Channel"],
            ["owner", "Owner"],
          ];'''
          labels = anchor + '''
          const SOURCE_LABELS = {
            meta_ads: "Meta Ads",
            meta_post: "Meta post",
            facebook_referral: "Facebook referral",
            instagram_referral: "Instagram referral",
            facebook_organic: "Facebook organic / untracked",
            instagram_organic: "Instagram organic / untracked",
            whatsapp_unattributed: "WhatsApp direct / untracked",
          };'''
          if anchor not in text:
              raise SystemExit('Analytics constants anchor not found')
          text = text.replace(anchor, labels, 1)

          old = '''            <FilterSelect label="Source" value={draftFilters.source} onChange={(value) => updateDraft("source", value)} options={filterOptions.sources} />'''
          new = '''            <FilterSelect label="Source" value={draftFilters.source} onChange={(value) => updateDraft("source", value)} options={filterOptions.sources} format={formatSource} />'''
          if old not in text:
              raise SystemExit('Analytics source filter target not found')
          text = text.replace(old, new, 1)

          old = '''              const displayLabel = safeTab === "channel" ? formatChannel(row.label) : row.label;'''
          new = '''              const displayLabel = safeTab === "channel"
                ? formatChannel(row.label)
                : safeTab === "source"
                  ? formatSource(row.label)
                  : row.label;'''
          if old not in text:
              raise SystemExit('Analytics mobile breakdown label target not found')
          text = text.replace(old, new, 1)

          old = '''                      <td className="py-3 pr-3 font-semibold">{safeTab === "channel" ? formatChannel(row.label) : row.label}{canOpen && <span className="ml-1.5 text-[var(--color-primary)]">→</span>}</td>'''
          new = '''                      <td className="py-3 pr-3 font-semibold">{safeTab === "channel" ? formatChannel(row.label) : safeTab === "source" ? formatSource(row.label) : row.label}{canOpen && <span className="ml-1.5 text-[var(--color-primary)]">→</span>}</td>'''
          if old not in text:
              raise SystemExit('Analytics desktop breakdown label target not found')
          text = text.replace(old, new, 1)

          tail = '''function formatChannel(value) {
            if (!value) return value;
            if (value === "whatsapp") return "WhatsApp";
            if (value === "instagram") return "Instagram";
            if (value === "facebook") return "Facebook";
            return value;
          }'''
          replacement = '''function formatChannel(value) {
            if (!value) return value;
            if (value === "whatsapp") return "WhatsApp";
            if (value === "instagram") return "Instagram";
            if (value === "facebook") return "Facebook";
            return value;
          }

          function formatSource(value) {
            return SOURCE_LABELS[value] || value;
          }'''
          if tail not in text:
              raise SystemExit('Analytics formatter anchor not found')
          text = text.replace(tail, replacement, 1)
          path.write_text(text)
          PY

      - name: Commit labels and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-attribution-analytics-labels.yml
          git add portal-frontend/src/pages/Analytics.jsx
          git commit -m "Format attribution sources in Analytics"
          git push origin HEAD:feature/lead-source-attribution
