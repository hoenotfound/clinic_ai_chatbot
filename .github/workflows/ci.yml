name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Replaced PR commits should cancel outdated checks, but each main push needs
# an independent concurrency group so no pending main run is discarded.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clinic_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clinic_ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clinic_ai_test
      # ffmpeg-static downloads a release binary at install time. Use a
      # writable runner path; /usr/bin/ffmpeg is root-owned and not writable.
      FFMPEG_BIN: /tmp/clinic-ai-ci-ffmpeg
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reject edits to applied migration files
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          changed="$(git diff --name-only --diff-filter=MDR "${{ github.event.pull_request.base.sha }}" HEAD -- 'src/db/migrations/*.sql')"
          if [ -n "$changed" ]; then
            echo "Existing migration files are immutable once merged. Add a new numbered migration instead."
            echo "$changed"
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Temporary supply-chain verification to record the published package SRI.
      - name: Inspect patched body-parser package integrity
        run: npm view body-parser@1.20.9 dist.integrity --json
      - run: npm ci
      - name: Check backend JavaScript syntax
        shell: bash
        run: find src scripts -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: npm test
      - name: Audit production dependencies (retry registry errors)
        run: bash .github/scripts/npm-audit-retry.sh --omit=dev --audit-level=moderate

  # Run frontend checks separately from the browser suites.
  portal-static:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Audit portal dependencies (retry registry errors)
        run: bash "$GITHUB_WORKSPACE/.github/scripts/npm-audit-retry.sh" --audit-level=moderate

  portal-playwright:
    name: playwright-${{ matrix.label }}
    runs-on: ubuntu-latest
    # Ubuntu package mirrors stalled for >30 minutes installing WebKit's 181
    # system packages. Pin Playwright's official browser/dependency image and
    # run the same full E2E suite without a network-dependent apt installation.
    # Match the container tag to the @playwright/test version installed below.
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: desktop-chromium
            project: desktop-chromium
            browser: chromium
            shard_args: ""
          # Split only the iPad project. Both halves must pass the final gate.
          - label: ipad-landscape-1-of-2
            project: ipad-landscape
            browser: webkit
            shard_args: "--shard=1/2"
          - label: ipad-landscape-2-of-2
            project: ipad-landscape
            browser: webkit
            shard_args: "--shard=2/2"
          # Keep every iPhone test but avoid the monolithic 158-test run
          # hitting the hosted-runner job timeout after slow WebKit apt setup.
          - label: iphone-portrait-1-of-2
            project: iphone-portrait
            browser: webkit
            shard_args: "--shard=1/2"
          - label: iphone-portrait-2-of-2
            project: iphone-portrait
            browser: webkit
            shard_args: "--shard=2/2"
    defaults:
      run:
        working-directory: portal-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal-frontend/package-lock.json
      - run: npm ci
      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.0
      # The pinned Playwright image already includes Chromium, WebKit and
      # their Ubuntu runtime packages. Do not run playwright install --with-deps:
      # apt mirror stalls caused the cancelled CI runs on GitHub-hosted VMs.
      - name: Run Playwright smoke tests
        run: npx playwright test --project=${{ matrix.project }} ${{ matrix.shard_args }}

  # Keep the existing required check name; every browser matrix result must
  # pass, including both iPad shards and both iPhone shards.
  portal-checks:
    if: ${{ always() }}
    needs: [portal-static, portal-playwright]
    runs-on: ubuntu-latest
    steps:
      - name: Require static checks and all browser suites
        env:
          STATIC_RESULT: ${{ needs.portal-static.result }}
          PLAYWRIGHT_RESULT: ${{ needs.portal-playwright.result }}
        run: |
          echo "Portal static checks: $STATIC_RESULT"
          echo "Playwright browser suites: $PLAYWRIGHT_RESULT"
          test "$STATIC_RESULT" = success && test "$PLAYWRIGHT_RESULT" = success
