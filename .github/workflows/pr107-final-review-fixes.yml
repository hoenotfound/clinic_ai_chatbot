name: PR107 final review fixes

on:
  push:
    branches:
      - feature/first-run-client-setup-wizard

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/first-run-client-setup-wizard
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Apply targeted fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          def sub_once(path, pattern, replacement):
              p = Path(path)
              text = p.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f"Expected exactly one regex match in {path}, found {count}: {pattern!r}")
              p.write_text(updated)

          sub_once(
              "src/services/clientSetupService.js",
              r'  const locationMissing = locationRequired && !branchesConfigured\n    \? \["Add at least one branch"\]\n    : \[\];',
              '''  const clinicBranches = Array.isArray(config.branches) ? config.branches : [];
          const clinicBranchMissingAddress = config?.businessType === "aesthetic_clinic"
            && clinicBranches.some((branch) => text(branch?.name) && !text(branch?.address));
          const locationMissing = locationRequired
            ? [
                ...(!branchesConfigured ? ["Add at least one branch"] : []),
                ...(clinicBranchMissingAddress ? ["Add an address for every clinic branch"] : []),
              ]
            : [];''',
          )

          sub_once(
              "test/clientSetupWizard.test.js",
              r'(  assert\.equal\(clinicLocations\.state, "needs_attention"\);\n  assert\.equal\(clinicStatus\.requiredComplete, false\);\n)(\}\);)',
              r'''\1
            const clinicMissingAddress = configuredBusiness("aesthetic_clinic");
            clinicMissingAddress.branches = [{ name: "KL", address: "", phone: "" }];
            const missingAddressStatus = evaluateClientSetup(clinicMissingAddress);
            const missingAddressLocations = missingAddressStatus.sections.find((section) => section.id === "locations");
            assert.equal(missingAddressLocations.complete, false);
            assert.equal(missingAddressLocations.state, "needs_attention");
            assert.match(missingAddressLocations.missing.join(" "), /address/i);
            assert.equal(missingAddressStatus.requiredComplete, false);
          \2''',
          )

          replace_once(
              "portal-frontend/src/pages/ClientSetupWizard.jsx",
              '<Field label="Business name"><input className={INPUT_CLASS} value={draft.businessName || draft.clinicName || ""} onChange={(event) => setDraftValue("businessName", event.target.value)} /></Field>',
              '''{!locked && (
                <div className="mb-4 rounded-xl border border-[var(--color-accent)]/30 bg-[var(--color-accent-light)] px-3.5 py-3 text-xs leading-5 text-[var(--color-text-muted)]">
                  Confirm the business profile to unlock client-specific business fields. This prevents draft details from being replaced when the profile is applied.
                </div>
              )}
              <Field label="Business name"><input className={INPUT_CLASS} disabled={!locked} value={draft.businessName || draft.clinicName || ""} onChange={(event) => setDraftValue("businessName", event.target.value)} /></Field>''',
          )
          replace_once(
              "portal-frontend/src/pages/ClientSetupWizard.jsx",
              '<textarea rows={3} className={TEXTAREA_CLASS} value={draft.businessDescription || ""} onChange={(event) => setDraftValue("businessDescription", event.target.value)} />',
              '<textarea rows={3} className={TEXTAREA_CLASS} disabled={!locked} value={draft.businessDescription || ""} onChange={(event) => setDraftValue("businessDescription", event.target.value)} />',
          )
          replace_once(
              "portal-frontend/src/pages/ClientSetupWizard.jsx",
              '<input className={INPUT_CLASS} value={draft.aiAssistantName || ""} onChange={(event) => setDraftValue("aiAssistantName", event.target.value)} />',
              '<input className={INPUT_CLASS} disabled={!locked} value={draft.aiAssistantName || ""} onChange={(event) => setDraftValue("aiAssistantName", event.target.value)} />',
          )
          replace_once(
              "portal-frontend/src/pages/ClientSetupWizard.jsx",
              '<textarea rows={3} className={TEXTAREA_CLASS} value={draft.introMessage || ""} onChange={(event) => setDraftValue("introMessage", event.target.value)} />',
              '<textarea rows={3} className={TEXTAREA_CLASS} disabled={!locked} value={draft.introMessage || ""} onChange={(event) => setDraftValue("introMessage", event.target.value)} />',
          )

          replace_once(
              "test/clientSetupWizard.test.js",
              '  assert.match(wizard, /businessDescription/);',
              '''  assert.match(wizard, /businessDescription/);
          assert.match(wizard, /Confirm the business profile to unlock client-specific business fields/);
          assert.equal((wizard.match(/disabled=\\{!locked\\}/g) || []).length, 4);''',
          )

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

      - name: Install portal dependencies
        run: npm --prefix portal-frontend ci

      - name: Lint portal
        run: npm --prefix portal-frontend run lint

      - name: Build portal
        run: npm --prefix portal-frontend run build

      - name: Commit verified fixes and remove temporary workflow
        run: |
          rm .github/workflows/pr107-final-review-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/clientSetupService.js test/clientSetupWizard.test.js portal-frontend/src/pages/ClientSetupWizard.jsx .github/workflows/pr107-final-review-fixes.yml
          git commit -m "Align client setup validation and profile entry"
          git push origin HEAD:feature/first-run-client-setup-wizard
