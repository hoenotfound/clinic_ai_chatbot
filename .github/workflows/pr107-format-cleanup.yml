name: PR107 final fix formatting

on:
  push:
    branches:
      - feature/first-run-client-setup-wizard

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/first-run-client-setup-wizard
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Clean formatting
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one formatting match in {path}, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/services/clientSetupService.js",
              '''  const clinicBranches = Array.isArray(config.branches) ? config.branches : [];
          const clinicBranchMissingAddress = config?.businessType === "aesthetic_clinic"
            && clinicBranches.some((branch) => text(branch?.name) && !text(branch?.address));
          const locationMissing = locationRequired
            ? [
                ...(!branchesConfigured ? ["Add at least one branch"] : []),
                ...(clinicBranchMissingAddress ? ["Add an address for every clinic branch"] : []),
              ]
            : [];
          '''.replace('          const clinicBranchMissingAddress', 'const clinicBranchMissingAddress').replace('            && clinicBranches', '  && clinicBranches').replace('          const locationMissing', 'const locationMissing').replace('            ? [', '  ? [').replace('                ...(!branchesConfigured', '      ...(!branchesConfigured').replace('                ...(clinicBranchMissingAddress', '      ...(clinicBranchMissingAddress').replace('              ]', '    ]').replace('            : [];', '  : [];'),
              '''  const clinicBranches = Array.isArray(config.branches) ? config.branches : [];
          const clinicBranchMissingAddress = config?.businessType === "aesthetic_clinic"
            && clinicBranches.some((branch) => text(branch?.name) && !text(branch?.address));
          const locationMissing = locationRequired
            ? [
                ...(!branchesConfigured ? ["Add at least one branch"] : []),
                ...(clinicBranchMissingAddress ? ["Add an address for every clinic branch"] : []),
              ]
            : [];
          ''',
          )

          replace_once(
              "portal-frontend/src/pages/ClientSetupWizard.jsx",
              '''      {!locked && (
          <div className="mb-4 rounded-xl border border-[var(--color-accent)]/30 bg-[var(--color-accent-light)] px-3.5 py-3 text-xs leading-5 text-[var(--color-text-muted)]">
            Confirm the business profile to unlock client-specific business fields. This prevents draft details from being replaced when the profile is applied.
          </div>
        )}
        <Field label="Business name"><input className={INPUT_CLASS} disabled={!locked} value={draft.businessName || draft.clinicName || ""} onChange={(event) => setDraftValue("businessName", event.target.value)} /></Field>'''.replace('          <div', '      <div').replace('            Confirm', '        Confirm').replace('          </div>', '      </div>').replace('        )}', '    )}').replace('        <Field', '    <Field'),
              '''      {!locked && (
                <div className="mb-4 rounded-xl border border-[var(--color-accent)]/30 bg-[var(--color-accent-light)] px-3.5 py-3 text-xs leading-5 text-[var(--color-text-muted)]">
                  Confirm the business profile to unlock client-specific business fields. This prevents draft details from being replaced when the profile is applied.
                </div>
              )}
              <Field label="Business name"><input className={INPUT_CLASS} disabled={!locked} value={draft.businessName || draft.clinicName || ""} onChange={(event) => setDraftValue("businessName", event.target.value)} /></Field>''',
          )
      - name: Install and test backend
        run: npm ci && npm test
      - name: Install and verify portal
        run: npm --prefix portal-frontend ci && npm --prefix portal-frontend run lint && npm --prefix portal-frontend run build
      - name: Commit cleanup and remove workflow
        run: |
          rm .github/workflows/pr107-format-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/clientSetupService.js portal-frontend/src/pages/ClientSetupWizard.jsx .github/workflows/pr107-format-cleanup.yml
          git commit -m "Polish final client setup fixes"
          git push origin HEAD:feature/first-run-client-setup-wizard
