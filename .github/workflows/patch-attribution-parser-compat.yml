name: Patch attribution parser compatibility

on:
  push:
    branches:
      - feature/lead-source-attribution

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lead-source-attribution
          fetch-depth: 0

      - name: Preserve ordinary inbound parser shapes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          replacements = {
              'src/services/metaMessagingService.js': (
                  '''      const base = {\n        id: message.mid,\n        from: String(senderId),\n        channel,\n        profileName: null,\n        attribution,\n      };''',
                  '''      const base = {\n        id: message.mid,\n        from: String(senderId),\n        channel,\n        profileName: null,\n        ...(attribution ? { attribution } : {}),\n      };'''
              ),
              'src/services/whatsappService.js': (
                  '''          const base = {\n            id: message.id,\n            from: message.from,\n            profileName,\n            attribution,\n          };''',
                  '''          const base = {\n            id: message.id,\n            from: message.from,\n            profileName,\n            ...(attribution ? { attribution } : {}),\n          };'''
              ),
          }

          for filename, (old, new) in replacements.items():
              path = Path(filename)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'Expected parser block not found in {filename}')
              path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-attribution-parser-compat.yml
          git add src/services/metaMessagingService.js src/services/whatsappService.js
          git commit -m "Preserve inbound parser compatibility"
          git push origin HEAD:feature/lead-source-attribution
