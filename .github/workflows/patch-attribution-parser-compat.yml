name: Patch attribution parser compatibility

on:
  push:
    branches: [feature/lead-source-attribution]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message == 'Apply parser attribution compatibility fix' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lead-source-attribution
          fetch-depth: 0
      - name: Preserve ordinary inbound parser shapes
        run: |
          python - <<'PY'
          from pathlib import Path

          for filename in ['src/services/metaMessagingService.js', 'src/services/whatsappService.js']:
              path = Path(filename)
              text = path.read_text()
              old = '''          const base = {
            id: message.'''
              if filename.endswith('metaMessagingService.js'):
                  target = '''      const base = {
        id: message.mid,
        from: String(senderId),
        channel,
        profileName: null,
        attribution,
      };'''
                  replacement = '''      const base = {
        id: message.mid,
        from: String(senderId),
        channel,
        profileName: null,
        ...(attribution ? { attribution } : {}),
      };'''
              else:
                  target = '''          const base = {
            id: message.id,
            from: message.from,
            profileName,
            attribution,
          };'''
                  replacement = '''          const base = {
            id: message.id,
            from: message.from,
            profileName,
            ...(attribution ? { attribution } : {}),
          };'''
              if target not in text:
                  raise SystemExit(f'Parser target not found in {filename}')
              path.write_text(text.replace(target, replacement, 1))
          PY
      - name: Commit compatibility fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/metaMessagingService.js src/services/whatsappService.js
          git commit -m "Preserve inbound parser compatibility"
          git push origin HEAD:feature/lead-source-attribution
